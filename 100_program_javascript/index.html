<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumpulan 100 Program JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="atas">
    <h1>Kumpulan 100 Program JavaScript</h1>
    <p>Dibuat untuk membuka semua program latihan dari satu halaman.</p>

  <div class="kotak-menu">

      <button id="atasLagi">Ke atas</button>
    </div>
    <div id="daftar" class="daftar"></div>
  </div>

  <script src="code.js"></script>
</body>
</html>
