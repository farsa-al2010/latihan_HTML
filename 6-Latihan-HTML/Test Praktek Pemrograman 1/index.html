<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farsa Al Akbar</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      margin: 20px;
      line-height: 1.6;
    }

    h1 {
      color: #4A6FA5;
      text-align: center;
    }

    hr {
      border: 1px solid #ddd;
    }

    a {
      text-decoration: none;
      color: #4A6FA5;
    }

    p, li {
      line-height: 1.6;
    }

    img,
    iframe {
      display: block;
      margin: 20px auto;
      max-width: 100%;
    }

    table {
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      margin-top: 20px;
    }

    td {
      padding: 8px;
    }

    input,
    select,
    textarea {
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 5px;
    }

    input[type="button"] {
      width: 100px;
      height: 35px;
      background-color: #4A6FA5;
      color: white;
      border: none;
      cursor: pointer;
    }

    input[type="button"]:hover {
      background-color: #3b5d8a;
    }
  </style>
</head>
